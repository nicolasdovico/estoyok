
services:
  # Servidor Web Nginx para el Backend
  nginx:
    image: nginx:alpine
    container_name: estoyok-nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx:/etc/nginx/conf.d
    depends_on:
      - backend
    networks:
      - estoyok-network

  # PHP-FPM para Laravel
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: estoyok-backend
    volumes:
      - ./backend:/var/www/html
    networks:
      - estoyok-network
    depends_on:
      - postgres
      - redis

  # Laravel Queue Worker
  worker:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: estoyok-worker
    command: php artisan queue:work
    user: "www-data"
    volumes:
      - ./backend:/var/www/html
    networks:
      - estoyok-network
    depends_on:
      - postgres
      - redis
      - backend

  # Laravel Scheduler
  scheduler:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: estoyok-scheduler
    command: php artisan schedule:work
    user: "www-data"
    volumes:
      - ./backend:/var/www/html
    networks:
      - estoyok-network
    depends_on:
      - postgres
      - redis
      - backend

  # Base de Datos Geoespacial
  postgres:
    image: postgis/postgis:16-3.4
    container_name: estoyok-postgres
    environment:
      POSTGRES_DB: estoyok_db
      POSTGRES_USER: estoyok_user
      POSTGRES_PASSWORD: estoyok_password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - estoyok-network

  # Cache y Colas de Laravel
  redis:
    image: redis:alpine
    container_name: estoyok-redis
    ports:
      - "6379:6379"
    networks:
      - estoyok-network

  # Frontend Web (Next.js)
  frontend:
    build:
      context: ./frontend-web
      dockerfile: ../docker/node/Dockerfile
    container_name: estoyok-frontend
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-web:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    networks:
      - estoyok-network
    depends_on:
      - backend

  # Mailpit para pruebas de email
  mailpit:
    image: axllent/mailpit
    container_name: estoyok-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - estoyok-network

  # Evolution API (WhatsApp Gateway Self-Hosted)
  evolution-api:
    image: evoapicloud/evolution-api:v2.2.0
    container_name: estoyok-evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - API_KEY=estoyok_secret_key_2026
      - AUTHENTICATION_API_KEY=estoyok_secret_key_2026
      - AUTHENTICATION_TYPE=apikey
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/0
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=true
      - REDIS_URI=redis://redis:6379/0
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://estoyok_user:estoyok_password@postgres:5432/estoyok_db?schema=evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - CONFIG_SESSION_PHONE_CLIENT=Chrome
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1043857760
      - CONFIG_SESSION_PHONE_SYNC_FULL_HISTORY=false
      - NODE_OPTIONS=--network-family-autoselection-attempt-timeout=1000
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - estoyok-network

networks:
  estoyok-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  evolution_instances:
    driver: local
